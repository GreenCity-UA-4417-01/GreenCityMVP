name: CI/CD GreenCity

concurrency:
  group: Testing-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ dev_java21 ]
  pull_request:
    branches: [ dev_java21 ]
  workflow_dispatch:

env:
  repository: greencity
  bootModule: core
  onbootJarName: app.jar
  dockerRepoName: skyere/greencity

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: maven

      - name: Build, test, JaCoCo report, SonarCloud analysis
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify jacoco:report sonar:sonar \
          -Dsonar.projectKey=GreenCity-UA-4417-01_GreenCityMVP \
          -Dsonar.organization=greencity-ua-4417-01 \
          -Dsonar.host.url=https://sonarcloud.io

      - name: Test Reporter
        uses: dorny/test-reporter@v1.5.0
        if: success() || failure()
        with:
          name: Tests Report
          path: ${{ env.bootModule }}/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Rename boot jar to app.jar
        run: |
          JAR_PATH=$(ls -1 $bootModule/target/*.jar | grep -vE '(sources|javadoc|original)' | head -n 1)
          echo "Using jar: $JAR_PATH"
          mv "$JAR_PATH" "$bootModule/target/$onbootJarName"

